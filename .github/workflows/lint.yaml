
name: Auto Linter

on:
  push:
    paths:
      - "**.py"

jobs:
  code:
    runs-on: ubuntu-latest

    steps:
      # Clone the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install Linter
      - name: Install Linter
        run: pip install flake8

      # Run Linter
      - name: Run Python Linter
        run: flake8 .
